<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Práctica 39 - Gimnasio</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h1>Gestión de Atletas</h1>

    <!-- Momento 1: Ingreso de datos -->
    <div class="tarjeta">
        <h3>Registrar Entrenamiento</h3>
        <input type="text" id="nombre" placeholder="Nombre del atleta">
        <input type="number" id="edad" placeholder="Edad">
        
        <select id="tipo-ejercicio">
            <option value="fuerza">Fuerza</option>
            <option value="flexibilidad">Flexibilidad</option>
            <option value="resistencia">Resistencia</option>
        </select>
        
        <input type="number" id="minutos" placeholder="Cantidad de minutos">
        <button type="button" id="btn-agregar">Guardar Rutina</button>
    </div>

    <!-- Momento 2: Resultados -->
    <div class="tarjeta">
        <h3>Informes</h3>
        <button type="button" id="btn-resultados">Calcular Estadísticas</button>
        <div id="resultados" class="caja-resultados"></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
