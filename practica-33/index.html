<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Maratón</title>
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <h1>Registro de Corredores</h1>
    <form id="form-maraton">
        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="apellido" placeholder="Apellido">
        <input type="number" id="edad" placeholder="Edad">
        <input type="number" id="numero" placeholder="Número">
        <input type="number" id="tiempo" placeholder="Tiempo (minutos)">
        <button type="button" id="btn-agregar">Agregar Corredor</button>
        <button type="button" id="btn-procesar">Procesar Resultados</button>
    </form>
    <div id="resultados"></div>
    <script src="js/script.js"></script>
</body>
</html>
