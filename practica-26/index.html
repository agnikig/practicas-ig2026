<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 26 - Alquiler de Equipos</title>
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

    <h1>Presupuesto para Obra Multimedia</h1>
    
    <form id="formulario-presupuesto">
        <label>Cantidad de Proyectores:</label>
        <input type="number" id="proyectores">
        <br><br>
        
        <label>Cantidad de Computadoras:</label>
        <input type="number" id="computadoras">
        <br><br>

        <label>Cantidad de Pantallas:</label>
        <input type="number" id="pantallas">
        <br><br>

        <label>Cantidad de Días de alquiler:</label>
        <input type="number" id="dias">
        <br><br>
        
        <button type="button" id="btn-calcular">Calcular Presupuesto</button>
    </form>

    <h2 id="resultado"></h2>

    <script src="js/script.js"></script>
</body>
</html>
