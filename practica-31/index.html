<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración de Pedidos</title>
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <h1>Carga de Pedidos</h1>
    <form id="form-pedido">
        <label>Nombre:</label>
        <input type="text" id="nombre">
        <label>Monto:</label>
        <input type="number" id="monto">
        
        <button type="button" id="btn-registrar">Registrar Pedido</button>
        <button type="button" id="btn-calcular">Calcular Resultados</button>
    </form>

    <div id="resultados"></div>

    <script src="js/script.js"></script>
</body>
</html>
